name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SessionDock.csproj -c Release
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Check hook script syntax
        run: node --check hook/agent-dock-hook.js
      - name: Publish the single-file release exe
        run: dotnet publish SessionDock.csproj -c Release -r win-x64 -o publish
      - name: Check install.ps1 parses
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
