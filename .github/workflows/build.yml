name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build SessionDock.csproj -c Release
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Check hook script syntax
        run: node --check hook/agent-dock-hook.js
